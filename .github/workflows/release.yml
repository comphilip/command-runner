name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows executable and publish release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable MSVC tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure native Release build
        shell: pwsh
        run: |
          cmake --preset windows-x64-release

      - name: Build native Release executable
        shell: pwsh
        run: |
          cmake --build --preset windows-x64-release --parallel

      - name: Run native regression tests
        shell: pwsh
        run: |
          ctest --preset windows-x64-release --output-on-failure

      - name: Verify Release artifact
        shell: pwsh
        run: |
          .\scripts\verify-release.ps1 `
            -ExecutablePath "out\build\windows-x64-release\Release\CommandRunner.exe"

      - name: Save PDB for crash analysis
        uses: actions/upload-artifact@v4
        with:
          name: CommandRunner-${{ github.ref_name }}-symbols
          path: out/build/windows-x64-release/Release/CommandRunner.pdb
          if-no-files-found: error

      - name: Extract release notes from changelog
        shell: pwsh
        run: |
          .\scripts\extract-release-notes.ps1 `
            -Tag "${{ github.ref_name }}" `
            -ChangelogPath "CHANGELOG.md" `
            -OutputPath "release-notes.md"

      - name: Create GitHub Release and upload executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "out\build\windows-x64-release\Release\CommandRunner.exe#CommandRunner.exe" `
            --verify-tag `
            --title "Command Runner ${{ github.ref_name }}" `
            --notes-file "release-notes.md"
